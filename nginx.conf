types {
    text/html                             html htm shtml;
    text/css                              css;
    application/javascript                js mjs;
    application/json                      json;
    image/png                             png;
    image/jpeg                            jpeg jpg;
    image/svg+xml                         svg svgz;
    image/webp                            webp;
    image/x-icon                          ico;
    font/woff                             woff;
    font/woff2                            woff2;
    application/octet-stream              bin;
}

server {
    listen ${PORT};
    server_name localhost;

    # Канонический домен. Любой другой Host, включая *.herokuapp.com,
    # получает 301 на www.deiden.com с сохранением пути и query-строки.
    if ($host != "www.deiden.com") {
        return 301 https://www.deiden.com$request_uri;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}